  - apps/merchant/src/app/api/merchant/session
  - apps/merchant/src/app/api/staff
  - apps/merchant/src/app/api/counter/_auth.ts
  - apps/merchant/src/proxy.ts
  - packages/domain/src/server/counter/core.ts
  # Tenant isolation at DB level (customer list RLS)
  - apps/merchant/src/server/customers
  # Consumer authentication / sessions / OAuth
  - packages/domain/src/server/consumer/oauth
  - packages/domain/src/server/consumer/session.ts
  - packages/domain/src/server/consumer/core.ts
  - apps/consumer/src/app/api/public/auth
  - apps/consumer/src/app/api/public/session
  # Externally triggered endpoints (cron secret, provider webhooks)
  - apps/merchant/src/app/api/internal
  # Wallet pass signing / web service, push crypto
  - packages/domain/src/server/wallet
  - apps/consumer/src/app/api/public/wallet
  - packages/domain/src/server/push
  # Counter: value-granting operations
  - apps/merchant/src/server/counter
  - apps/merchant/src/app/api/counter
  # Destructive / test-DB tooling
  - tools/wipe-database.sql
  - tools/neon-test.sh

