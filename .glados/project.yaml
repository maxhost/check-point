# GLaDOS Project Quality Profile — CheckPass Club (repo `mi-pasaporte`).
# Schema: GlaDOS packages/core/src/project-quality-profile.ts (version 1).
#
# Every command is an existing root script (package.json) or repo tool. Each one is prefixed
# with the repo's documented Node 24 recipe (CLAUDE.md §Gotchas, AGENTS.md: `nvm use` with no
# argument, `.nvmrc` = 24.20.0), because a plain /bin/sh may start on another Node.
#
# Worktree requirements (see .glados/project.md §Verification):
#   - dependencies installed in the worktree itself (`pnpm install --frozen-lockfile`); never
#     symlink node_modules from the main checkout (tools/worktree-new.sh explains why).
#   - `integration` needs the gitignored `apps/merchant/.env.local` with the NEON_CI_* keys; it
#     runs against the `ci-integration` Neon branch and aborts if that equals DATABASE_URL (prod).
version: 1

quality:
  typecheck:
    command: '. "$HOME/.nvm/nvm.sh" && nvm use >/dev/null && pnpm typecheck'
    timeoutMs: 600000
  lint:
    command: '. "$HOME/.nvm/nvm.sh" && nvm use >/dev/null && pnpm lint'
    timeoutMs: 600000
  unit:
    # Vitest across apps/* and tools/. Neon suites (*.neon.integration.test.ts) self-skip here.
    command: '. "$HOME/.nvm/nvm.sh" && nvm use >/dev/null && pnpm test'
    timeoutMs: 600000
  integration:
    # Migrates the Neon CI branch, then runs the whole vitest suite with Neon enabled.
    command: '. "$HOME/.nvm/nvm.sh" && nvm use >/dev/null && bash tools/neon-test.sh'
    timeoutMs: 1800000
  e2e:
    # Playwright (chromium); starts consumer/merchant/platform `next dev` on 3100-3102.
    command: '. "$HOME/.nvm/nvm.sh" && nvm use >/dev/null && pnpm test:e2e'
    timeoutMs: 1200000
  build:
    command: '. "$HOME/.nvm/nvm.sh" && nvm use >/dev/null && pnpm build'
    timeoutMs: 1200000

