name: Wallet push worker

# Interim durability net for spec 0033 while the project stays on the Vercel Hobby
# plan (max 2 cron jobs, daily-only frequency — the native cron was removed from
# apps/merchant/vercel.json for that reason). This scheduled workflow pings the
# authenticated worker endpoint every ~5 minutes to drain wallet_push_queue: retries
# failed pushes and (later) releases queued campaign notices. The instant transactional
# push still fires inline at the moment of the sale (kept alive with `after()`), so a
# GitHub Actions delay only affects retries/campaigns, never the "te dieron puntos" push.
# When the project moves to Vercel Pro, re-add the cron to vercel.json and delete this.
#
# Requires two repo Actions secrets:
#   WALLET_PUSH_ENDPOINT = https://<prod-domain>/api/internal/wallet-push
#   CRON_SECRET          = same value set in Vercel (the endpoint's Bearer token)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# A late run must never pile up on a previous one.
concurrency:
  group: wallet-push-cron
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Drain wallet_push_queue via the Vercel endpoint
        env:
          ENDPOINT: ${{ secrets.WALLET_PUSH_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ENDPOINT" ] || [ -z "$CRON_SECRET" ]; then
            echo "WALLET_PUSH_ENDPOINT / CRON_SECRET not configured — skipping."
            exit 0
          fi
          code=$(curl -sS --max-time 60 -o /tmp/out -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ENDPOINT")
          echo "HTTP $code"
          cat /tmp/out || true
          echo
          test "$code" = "200"
