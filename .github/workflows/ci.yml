name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Los browsers NO vienen con `pnpm install`: el paquete @playwright/test trae la
      # libreria, los binarios se bajan aparte a ~/.cache/ms-playwright, vacio en un
      # runner limpio (spec 0048). Solo chromium: playwright.config.ts no declara
      # `projects`, asi que corre con el default.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      # Ultimo a proposito (spec 0047): el estilo es la falla menos informativa del set.
      # Como primer paso cortaba el job y dejaba al repo sin gate real.
      - run: pnpm format:check
