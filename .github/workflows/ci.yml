name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# La integracion corre contra UNA rama Neon persistente (`ci-integration`, spec 0062). Dos
# jobs a la vez sobre la misma rama se pisarian los FOR UPDATE y el estado; se serializan.
concurrency:
  group: ci-integration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Spec 0062: los 27 archivos `.neon.integration` se auto-skipean sin estas dos
      # variables, y un "skipped" se ve igual que un "passed" desde afuera. Antes de la
      # 0062 se podia borrar un guard de produccion con los 5 gates en verde (probado por
      # mutacion en la spec 0061). Por eso este paso FALLA FUERTE si el secret no llego —
      # nunca degrada a "sin integracion".
      - name: La integracion Neon tiene que correr, no skipearse
        env:
          NEON_INTEGRATION_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          # Spec 0118: el oraculo del rol del cliente se conecta COMO `checkpass_consumer`.
          NEON_INTEGRATION_CONSUMER_DATABASE_URL: ${{ secrets.NEON_CI_CONSUMER_DATABASE_URL }}
        run: |
          if [ -z "$NEON_INTEGRATION_DATABASE_URL" ]; then
            echo "::error::NEON_CI_DATABASE_URL ausente: la integracion se skipearia en silencio"
            exit 1
          fi
          if [ -z "$NEON_INTEGRATION_CONSUMER_DATABASE_URL" ]; then
            echo "::error::NEON_CI_CONSUMER_DATABASE_URL ausente: el oraculo del rol del cliente no correria"
            exit 1
          fi
      # One wrapper owns migration, the anti-PROD interlock and global-DDL isolation.
      - name: Unit + integracion Neon
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          NEON_CI_DATABASE_URL_UNPOOLED: ${{ secrets.NEON_CI_DATABASE_URL_UNPOOLED }}
          NEON_CI_CONSUMER_DATABASE_URL: ${{ secrets.NEON_CI_CONSUMER_DATABASE_URL }}
        run: |
          umask 077
          export NEON_TEST_ENV_FILE="$(mktemp "${RUNNER_TEMP}/checkpass-neon-ci.XXXXXX")"
          trap 'rm -f "$NEON_TEST_ENV_FILE"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const keys = ["NEON_CI_DATABASE_URL", "NEON_CI_DATABASE_URL_UNPOOLED", "NEON_CI_CONSUMER_DATABASE_URL"];
          const lines = keys.map((key) => {
            const value = process.env[key];
            if (!value || /[\r\n]/.test(value)) throw new Error(`${key} ausente o inválida`);
            return `${key}=${value}`;
          });
          writeFileSync(process.env.NEON_TEST_ENV_FILE, lines.join("\n") + "\n", { mode: 0o600 });
          NODE
          tools/neon-test.sh
      # Los browsers NO vienen con `pnpm install`: el paquete @playwright/test trae la
      # libreria, los binarios se bajan aparte a ~/.cache/ms-playwright, vacio en un
      # runner limpio (spec 0048). Solo chromium: playwright.config.ts no declara
      # `projects`, asi que corre con el default.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      # Ultimo a proposito (spec 0047): el estilo es la falla menos informativa del set.
      # Como primer paso cortaba el job y dejaba al repo sin gate real.
      - run: pnpm format:check
